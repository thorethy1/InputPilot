name: Create beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version (for example 0.9.0-beta.1)
        required: true
        default: 0.9.0-beta.1
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-beta-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout latest beta
        uses: actions/checkout@v4
        with:
          ref: refs/heads/beta
          fetch-depth: 0

      - name: Require green CI on beta head
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$head_sha" --event push --limit 20 \
            --json databaseId,status,conclusion,url)"
          latest="$(jq -r 'if length > 0 then .[0] else empty end' <<<"$runs")"
          if [[ -z "$latest" ]]; then
            echo "::error::No push-triggered CI run found for beta head $head_sha. Push the versioned commit and let CI run first."
            exit 1
          fi
          run_id="$(jq -r '.databaseId' <<<"$latest")"
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
          url="$(jq -r '.url' <<<"$latest")"
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::Latest CI run on beta ($head_sha) is status=$status conclusion=$conclusion: $url"
            echo "Fix or wait for CI to be green, then retry."
            exit 1
          fi

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          if ! jq -e \
            --arg firmware "InputPilot-Firmware-$head_sha" \
            --arg ios "InputPilot-unsigned-$head_sha" '
              [.artifacts[] | select(.expired == false) | .name] as $names |
              ($names | index($firmware)) != null and
              ($names | index($ios)) != null
            ' <<<"$artifacts" >/dev/null; then
            echo "::error::Green push CI run $run_id does not retain both release artifacts for $head_sha."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Latest push CI run on beta head $head_sha is green and has both release artifacts: $url"

      - name: Validate beta version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Beta version must match MAJOR.MINOR.PATCH-beta.NUMBER; got '$version'."
            exit 1
          fi
          configured="$(python3 versioning.py show-release)"
          if [[ "$configured" != "$version" ]]; then
            echo "::error::Beta head declares '$configured', but the requested release is '$version'."
            echo "Run 'python3 versioning.py set-release $version', commit and push it, wait for green CI, then retry."
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Increase the beta number."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [[ "$sha" != '${{ steps.ci.outputs.sha }}' ]]; then
            echo "::error::The validated CI commit changed unexpectedly."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          sha='${{ steps.version.outputs.sha }}'
          beta_head="$(git ls-remote origin refs/heads/beta | cut -f1)"
          if [[ "$beta_head" != "$sha" ]]; then
            echo "::error::beta advanced from validated commit $sha to $beta_head; rerun after its push CI is green."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$sha" -m "InputPilot ${{ steps.version.outputs.version }}"
          git push origin "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "InputPilot ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --prerelease \
            --verify-tag

      - name: Attach and verify beta artifacts
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" \
            --ref '${{ steps.version.outputs.tag }}' -f tag='${{ steps.version.outputs.tag }}'
          run_id=""
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow release-assets.yml --event workflow_dispatch \
              --commit "$sha" --limit 10 --json databaseId)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then break; fi
            echo "Waiting for release asset workflow (attempt $attempt/60)..."
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Release asset workflow did not start."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          {
            echo "## InputPilot ${{ steps.version.outputs.version }}"
            echo
            echo "Reused green push CI run: ${{ steps.ci.outputs.run_id }}"
            echo "Release asset run: $run_id"
            echo "The versioned prerelease, OTA assets and rolling AltStore beta feed are complete."
          } >> "$GITHUB_STEP_SUMMARY"
