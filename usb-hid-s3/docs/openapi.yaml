openapi: 3.0.3
info:
  title: InputPilot Firmware HTTP API
  description: |
    REST control and WiFi provisioning for the ESP32-S3 USB HID helper.

    **Discovery**
    - STA (home WiFi): `http://inputpilot-xxxx.local` (mDNS; `xxxx` = last 4 hex of
      MAC, lowercase) or `http://<sta-ip>`. `GET /api/status` returns `mdns` and
      `device_id` (12 lowercase hex, no colons).
    - Soft-AP setup: join WiFi `InputPilot-XXXX` (`XXXX` = last 4 hex of MAC,
      uppercase; open by default), then `http://192.168.4.1`
    - mDNS HTTP service TXT records: `path=/api/status`, `id=<device_id>`, `fw=<version>`

    All JSON endpoints send CORS headers (`Access-Control-Allow-Origin: *`)
    for browser / future mobile apps. Control routes feed the same command
    sink as USB serial and TCP `:3333`.

    Unpaired legacy firmware can protect `/api/*` with a compile-time
    `CONTROL_API_TOKEN`. After USB pairing, plaintext REST management and
    control return HTTP 426; only minimal `/api/status` discovery remains
    readable. Paired BLE and TCP use `secure_channel_v1` (HMAC-SHA-256, HKDF,
    and AES-256-GCM) and never transmit the pairing credential.
  version: 0.8.8
  contact:
    name: InputPilot
    url: https://github.com/thorethy1/InputPilot

servers:
  - url: http://inputpilot-xxxx.local
    description: STA via mDNS (preferred; xxxx = device suffix from /api/status)
  - url: http://192.168.4.1
    description: Soft-AP setup portal
  - url: http://{sta_ip}
    description: STA via DHCP IP
    variables:
      sta_ip:
        default: 192.168.2.161
        description: Device IPv4 from GET /api/status or /api/wifi

tags:
  - name: status
    description: Device health and discovery metadata
  - name: control
    description: USB HID mouse / keyboard / jiggle actions
  - name: wifi
    description: NVS WiFi credentials and Soft-AP provisioning
  - name: usb
    description: Persistent USB descriptor identity
  - name: firmware
    description: Authenticated transport-neutral OTA operations

paths:
  /:
    get:
      tags: [status]
      summary: Root index or Soft-AP setup page
      description: |
        On Soft-AP returns an HTML WiFi setup form.
        On STA returns a JSON API index listing endpoints.
      responses:
        "200":
          description: HTML (Soft-AP) or JSON index (STA)
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndex"

  /api/status:
    get:
      tags: [status]
      summary: Device status
      operationId: getStatus
      responses:
        "200":
          description: Current device status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
              example:
                ok: true
                name: InputPilot-Firmware
                version: "0.8.8"
                device_id: aabbccddeeff
                uptime_s: 120
                heap: 192000
                usb: ready
                jiggle: false
                jiggle_interval_ms: 30000
                click_enabled: false
                click_interval_ms: 60000
                sta_ip: 192.168.2.161
                mdns: inputpilot-eeff.local
                protocol_version: 1
                ota_schema: 1
                capabilities: [ble_control, tcp_control, rest_control, ble_ota]
    options:
      tags: [status]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/logs:
    get:
      tags: [status]
      summary: Bounded recent in-memory firmware logs
      operationId: getLogs
      responses:
        "200":
          description: At most 64 sequence-tagged lines; history is cleared on reboot
          content:
            application/json:
              schema:
                type: object
                required: [entries, latestSequence]
                properties:
                  entries:
                    type: array
                    maxItems: 64
                    items:
                      type: object
                      required: [sequence, line]
                      properties:
                        sequence: { type: integer, format: int64 }
                        line: { type: string }
                  latestSequence: { type: integer, format: int64 }
    options:
      tags: [status]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/diagnostics:
    get:
      tags: [status]
      summary: Transport-neutral device and OTA-slot diagnostics
      responses:
        "200":
          description: Device identity, software, partitions, uptime and heap
          content:
            application/json:
              schema:
                type: object
                required: [product, board, deviceId, firmware, protocol, otaSchema, runningPartition, bootPartition]
                properties:
                  product: { type: string }
                  board: { type: string }
                  deviceId: { type: string }
                  firmware: { type: string }
                  firmwareCommit: { type: string }
                  resetReason: { type: string }
                  protocol: { type: integer }
                  otaSchema: { type: integer }
                  runningPartition: { type: string }
                  bootPartition: { type: string }
                  uptime: { type: integer, format: int64 }
                  heap: { type: integer, format: int64 }
                  usbReady: { type: boolean }
                  otaState: { type: string }
                  hid:
                    type: object
                    properties:
                      rxBle: { type: integer, format: int64 }
                      rxTcp: { type: integer, format: int64 }
                      rxRest: { type: integer, format: int64 }
                      rxSerial: { type: integer, format: int64 }
                      decoded: { type: integer, format: int64 }
                      decodeErrors: { type: integer, format: int64 }
                      queued: { type: integer, format: int64 }
                      queueRejected: { type: integer, format: int64 }
                      executed: { type: integer, format: int64 }
                      failed: { type: integer, format: int64 }
                      mouseExecuted: { type: integer, format: int64 }
                      keyboardExecuted: { type: integer, format: int64 }
                      usbReportsAttempted: { type: integer, format: int64 }
                      usbReportsSucceeded: { type: integer, format: int64 }
                      usbReportsFailed: { type: integer, format: int64 }
                      lastSource: { type: string }
                      lastType: { type: string }
                      lastSequence: { type: integer, format: int64 }
                      lastPhase: { type: string }
                      previousBreadcrumbValid: { type: boolean }
                      previousSequence: { type: integer, format: int64 }
                      previousSource: { type: string }
                      previousEventType: { type: integer }
                      previousPhase: { type: integer }
                      previousBleRxType: { type: integer }
                      previousBleRxLength: { type: integer, format: int64 }
                      previousQueueDepth: { type: integer, format: int64 }

  /api/ota/start:
    post:
      tags: [firmware]
      summary: Start an authenticated Wi-Fi firmware update session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol, version, size, sha256]
              properties:
                protocol: { type: integer, enum: [1] }
                version: { type: string }
                size: { type: integer, minimum: 1 }
                sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        "200": { description: OTA engine ready for streaming upload }
        "400": { description: Invalid or incompatible request }
        "409": { description: Another OTA session is active }

  /api/ota/firmware:
    post:
      tags: [firmware]
      summary: Stream firmware.bin into the active Wi-Fi OTA session
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [firmware]
              properties:
                firmware: { type: string, format: binary }
      responses:
        "200": { description: "Image verified, boot partition selected, reboot scheduled" }
        "400": { description: "Upload, hash, image, metadata, size, or version validation failed" }

  /api/ota/status:
    get:
      tags: [firmware]
      summary: Read shared OTA engine state and progress
      responses:
        "200":
          description: Current OTA state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  offset: { type: integer }
                  size: { type: integer }
                  progress: { type: integer, minimum: 0, maximum: 100 }
                  firmware: { type: string }
                  error: { type: string }

  /api/ota/abort:
    post:
      tags: [firmware]
      summary: Abort the active Wi-Fi OTA session
      responses:
        "200": { description: Update cancelled safely }
        "409": { description: No Wi-Fi OTA is receiving }

  /api/jiggle:
    get:
      tags: [control]
      summary: Jiggle state
      operationId: getJiggle
      responses:
        "200":
          description: Current jiggle settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiggleStatus"
    post:
      tags: [control]
      summary: Enable or disable auto mouse jiggle
      operationId: setJiggle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JiggleRequest"
            examples:
              enable:
                value: { enabled: true }
              disable:
                value: { enabled: false }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiggleSetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/keep-awake:
    get:
      tags: [control]
      summary: Read independent persistent movement and click schedules
      responses:
        "200":
          description: Current firmware-owned Keep Awake settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeepAwakeSettings" }
    post:
      tags: [control]
      summary: Replace independent persistent movement and click schedules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeepAwakeSettings" }
      responses:
        "200": { description: Settings persisted and applied }
        "400": { $ref: "#/components/responses/BadRequest" }
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204": { description: No content }

  /api/move:
    post:
      tags: [control]
      summary: Relative mouse move
      operationId: moveMouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
            example:
              dx: 40
              dy: 0
              wheel: 0
      responses:
        "200":
          description: Move accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/type:
    post:
      tags: [control]
      summary: Type a string via USB keyboard HID
      operationId: typeText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypeRequest"
            example:
              text: hello
      responses:
        "200":
          description: Type accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/key:
    post:
      tags: [control]
      summary: Press a named key or combo
      description: |
        Key names match the serial `key` command (e.g. `enter`, `esc`, `tab`,
        `up`, `cmd+space`, `ctrl+shift+t`).
      operationId: pressKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyRequest"
            examples:
              enter:
                value: { key: enter }
              spotlight:
                value: { key: cmd+space }
      responses:
        "200":
          description: Key accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/click:
    post:
      tags: [control]
      summary: Mouse button click
      operationId: clickMouse
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClickRequest"
            example:
              button: left
      responses:
        "200":
          description: Click accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResponse"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/button:
    post:
      tags: [control]
      summary: Press or release a mouse button
      operationId: setMouseButton
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ButtonRequest"
      responses:
        "200":
          description: Button state accepted
        "400":
          $ref: "#/components/responses/BadRequest"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/release-all:
    post:
      tags: [control]
      summary: Release all keyboard keys, modifiers and mouse buttons
      operationId: releaseAll
      responses:
        "200":
          description: All HID state released
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/report:
    post:
      tags: [control]
      summary: Send one layout-resolved USB HID keyboard report
      description: The client maps a character using the selected host keyboard layout. The firmware presses and releases the supplied usage and modifiers; it does not decode UTF-8 here.
      operationId: sendKeyboardReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyboardReportRequest"
            example: { modifiers: 64, usage: 20 }
      responses:
        "200":
          description: Keyboard report accepted
        "400":
          $ref: "#/components/responses/BadRequest"
    options:
      tags: [control]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/wifi:
    get:
      tags: [wifi]
      summary: WiFi / Soft-AP status
      operationId: getWifi
      responses:
        "200":
          description: WiFi configuration and interface state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiStatus"
              examples:
                sta:
                  value:
                    mode: sta
                    configured: true
                    ssid: MyNetwork
                    ap_ssid: InputPilot-EEFF
                    ap_ip: 192.168.4.1
                    sta_ip: 192.168.2.161
                    device_id: aabbccddeeff
                    http_port: 80
                    control_port: 3333
                softAp:
                  value:
                    mode: ap
                    configured: false
                    ssid: ""
                    ap_ssid: InputPilot-EEFF
                    ap_ip: 192.168.4.1
                    sta_ip: ""
                    device_id: aabbccddeeff
                    http_port: 80
                    control_port: 3333
    post:
      tags: [wifi]
      summary: Save WiFi credentials and reconnect
      description: |
        Persists SSID/password to NVS, then reconnects as STA.
        Typical Soft-AP provisioning flow for first-time / forgotten WiFi.
      operationId: setWifi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WifiSetRequest"
            example:
              ssid: MyNetwork
              password: secret
      responses:
        "200":
          description: Saved; reconnect pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiSetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    options:
      tags: [wifi]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/wifi/clear:
    post:
      tags: [wifi]
      summary: Forget WiFi credentials
      description: |
        Clears NVS STA credentials. Device reconnects into Soft-AP setup mode
        (`InputPilot-XXXX`) so credentials can be provisioned again.
      operationId: clearWifi
      responses:
        "200":
          description: Cleared; reconnect pending (Soft-AP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiClearResponse"
              example:
                ok: true
                cleared: true
                reconnecting: true
    options:
      tags: [wifi]
      summary: CORS preflight
      responses:
        "204":
          description: No content

  /api/usb:
    get:
      tags: [usb]
      summary: Read the active USB descriptor identity
      operationId: getUsbIdentity
      responses:
        "200":
          description: USB values currently used at boot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsbIdentity"
    post:
      tags: [usb]
      summary: Save USB descriptor identity or restore defaults
      description: Persists validated values to NVS and restarts the firmware so USB re-enumerates.
      operationId: setUsbIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UsbIdentityUpdate"
                - $ref: "#/components/schemas/UsbIdentityReset"
      responses:
        "200":
          description: Saved; firmware restart scheduled
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    options:
      tags: [usb]
      summary: CORS preflight
      responses:
        "204":
          description: No content

components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: Required only when firmware `CONTROL_API_TOKEN` is set.
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Server / NVS failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          example: ssid required

    ApiIndex:
      type: object
      properties:
        name:
          type: string
          example: InputPilot-Firmware
        version:
          type: string
          example: "0.4.0"
        endpoints:
          type: array
          items:
            type: string

    DeviceStatus:
      type: object
      required: [ok, name, version]
      properties:
        ok:
          type: boolean
          enum: [true]
        name:
          type: string
        version:
          type: string
        device_id:
          type: string
          description: 12 lowercase hex MAC-derived ID (no colons)
          example: aabbccddeeff
        uptime_s:
          type: integer
          minimum: 0
        heap:
          type: integer
          minimum: 0
        usb:
          type: string
          enum: [ready, not-ready]
        jiggle:
          type: boolean
        jiggle_interval_ms:
          type: integer
        click_enabled:
          type: boolean
        click_interval_ms:
          type: integer
        sta_ip:
          type: string
          description: Empty when not on STA
        mdns:
          type: string
          description: Full mDNS FQDN for this device
        protocol_version:
          type: integer
          example: 1
        ota_schema:
          type: integer
          description: Dual-slot OTA partition schema; absent or 0 requires USB migration
          example: 1
        capabilities:
          type: array
          items:
            type: string
          example: [mouse_move, mouse_click, mouse_button_state, mouse_scroll, keyboard_type, keyboard_key, keyboard_layout, release_all, ble_control, tcp_control, rest_control, ble_ota, protocol_v1]

    JiggleStatus:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        enabled:
          type: boolean
        interval_ms:
          type: integer
          example: 10000

    JiggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        state:
          type: string
          description: Alternate form — `on` / `off` / `true` / `false`
          enum: [on, off, "true", "false", "1", "0"]
        jiggle:
          type: string
          description: Alias of `state`

    JiggleSetResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        enabled:
          type: boolean

    KeepAwakeSettings:
      type: object
      required: [move_enabled, move_interval_ms, click_enabled, click_interval_ms]
      properties:
        move_enabled: { type: boolean }
        move_interval_ms: { type: integer, minimum: 5000, maximum: 3600000, example: 30000 }
        click_enabled: { type: boolean }
        click_interval_ms: { type: integer, minimum: 5000, maximum: 3600000, example: 60000 }

    MoveRequest:
      type: object
      required: [dx, dy]
      properties:
        dx:
          type: integer
          description: Relative X pixels (positive = right)
        dy:
          type: integer
          description: Relative Y pixels (positive = down)
        wheel:
          type: integer
          description: Scroll wheel delta
          default: 0

    KeyboardReportRequest:
      type: object
      required: [modifiers, usage]
      properties:
        modifiers:
          type: integer
          minimum: 0
          maximum: 255
          description: USB HID modifier bitmap; right Alt/AltGr is 0x40
        usage:
          type: integer
          minimum: 0
          maximum: 255
          description: USB HID keyboard usage ID

    MoveResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        dx:
          type: integer
        dy:
          type: integer
        wheel:
          type: integer

    TypeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    TypeResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        len:
          type: integer

    KeyRequest:
      type: object
      properties:
        key:
          type: string
          description: Preferred field
          example: enter
        name:
          type: string
          description: Alias of `key`
      anyOf:
        - required: [key]
        - required: [name]

    KeyResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        key:
          type: string

    ClickRequest:
      type: object
      properties:
        button:
          type: string
          enum: [left, right, middle]
          default: left

    ClickResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        button:
          type: string

    ButtonRequest:
      type: object
      required: [button, state]
      properties:
        button:
          type: string
          enum: [left, right, middle]
        state:
          type: string
          enum: [down, up]

    WifiStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [off, ap, sta, ap+sta]
        configured:
          type: boolean
          description: True when NVS has a non-empty STA SSID
        ssid:
          type: string
          description: Configured STA SSID (may be empty)
        ap_ssid:
          type: string
          description: Per-device Soft-AP SSID (InputPilot-XXXX)
          example: InputPilot-EEFF
        device_id:
          type: string
          description: 12 lowercase hex MAC-derived ID (no colons)
          example: aabbccddeeff
        ap_ip:
          type: string
          example: 192.168.4.1
        sta_ip:
          type: string
        http_port:
          type: integer
          example: 80
        control_port:
          type: integer
          description: TCP line-control port (same grammar as serial)
          example: 3333

    WifiSetRequest:
      type: object
      required: [ssid]
      properties:
        ssid:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          maxLength: 63
          description: Empty string allowed for open networks
        pass:
          type: string
          description: Alias of `password`

    WifiSetResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        reconnecting:
          type: boolean
          enum: [true]
        ssid:
          type: string

    WifiClearResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        cleared:
          type: boolean
          enum: [true]
        reconnecting:
          type: boolean
          enum: [true]

    UsbIdentity:
      type: object
      required: [product_name, vid, pid, serial_number, requires_restart]
      properties:
        product_name:
          type: string
          minLength: 1
          maxLength: 31
          example: InputPilot
        vid:
          type: integer
          minimum: 1
          maximum: 65535
          example: 51966
        pid:
          type: integer
          minimum: 1
          maximum: 65535
          example: 16385
        vid_hex:
          type: string
          example: "0xCAFE"
        pid_hex:
          type: string
          example: "0x4001"
        serial_number:
          type: string
          minLength: 1
          maxLength: 31
          pattern: "^[A-Za-z0-9._-]+$"
          example: aabbccddeeff
        requires_restart:
          type: boolean
          enum: [true]

    UsbIdentityUpdate:
      type: object
      required: [product_name, vid, pid, serial_number]
