name: Attach release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to repair or retry (for example v0.6.4)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'beta'
    name: Validate and attach public assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      - name: Resolve release and validate versions
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$TAG_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH[-PRERELEASE]; got '$tag'."
            exit 1
          fi
          version="${tag#v}"
          sha="$(git rev-parse "${tag}^{commit}")"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "false" ]]; then
            echo "::error::Release '$tag' is still a draft. Publish it before attaching assets."
            exit 1
          fi

          python3 - "$version" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          if Path("Version.xcconfig").is_file():
              sys.path.insert(0, str(Path.cwd()))
              from versioning import release_version
              configured = release_version()
          else:
              config = Path("usb-hid-s3/include/Config.h").read_text(encoding="utf-8")
              match = re.search(r'#define\s+FW_VERSION\s+"([^"]+)"', config)
              configured = match.group(1) if match else ""
          if configured != version:
              raise SystemExit(
                  f"source declares {configured or 'no version'}, release tag declares {version}"
              )
          print(f"Shared app/firmware version matches {version}")
          PY

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$(jq -r '.published_at[0:10]' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.prerelease' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "Release tag $tag resolves to $sha"

      - name: Require successful CI for the release commit
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.release.outputs.sha }}"
          run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$sha" \
              --limit 20 \
              --json databaseId,status,conclusion,url)"
            run_id="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              break
            fi

            pending="$(jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length' <<<"$runs")"
            completed="$(jq '[.[] | select(.status == "completed")] | length' <<<"$runs")"
            if (( completed > 0 && pending == 0 )); then
              echo "::error::CI completed for $sha, but no run succeeded."
              jq -r '.[] | "run \(.databaseId): status=\(.status) conclusion=\(.conclusion) \(.url)"' <<<"$runs"
              exit 1
            fi
            echo "Waiting for successful CI on $sha (attempt $attempt/90)..."
            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful CI run with retained artifacts was found for $sha. Run CI for this exact commit, then retry this workflow manually with tag '${{ steps.release.outputs.tag }}'."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using successful CI run $run_id for exact commit $sha"

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: InputPilot-Firmware-${{ steps.release.outputs.sha }}
          path: staging/firmware
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download unsigned iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: InputPilot-unsigned-${{ steps.release.outputs.sha }}
          path: staging/ios
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate and package release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          python3 .github/scripts/package_release_assets.py \
            --tag "${{ steps.release.outputs.tag }}" \
            --release-date "${{ steps.release.outputs.date }}" \
            --input staging \
            --output release-assets
          {
            echo "## Release assets"
            echo
            echo "Source CI run: ${{ steps.ci.outputs.run_id }}"
            echo
            echo '```text'
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach assets to published release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release.outputs.tag }}" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published asset set
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          expected="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[].name' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Published assets do not match the expected set."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Verified release assets for $tag:"
          printf '%s\n' "$actual"

      - name: Update rolling AltStore channel feed
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          prerelease="${{ steps.release.outputs.prerelease }}"
          sha="${{ steps.release.outputs.sha }}"
          rm -rf altstore-channel && mkdir altstore-channel

          if [[ "$prerelease" == "true" ]]; then
            # The beta channel advertises a fixed rolling prerelease feed that
            # lives on the "beta" release; refresh it with every beta.
            served_tag="beta"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$served_tag" \
                > altstore-channel/feed-release.json 2>/dev/null; then
              gh release create "$served_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$sha" \
                --title "InputPilot Beta Channel" \
                --notes "Rolling AltStore feed for InputPilot beta releases." \
                --prerelease
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$served_tag" \
                > altstore-channel/feed-release.json
            fi
          else
            # Stable serves the newest full release's manifest; merge the
            # previous stable feed so version history survives new releases.
            served_tag="$tag"
            previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and .tag_name != "'"$tag"'")][0].tag_name // empty')"
            if [[ -n "$previous_tag" ]] && gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous_tag" \
                > altstore-channel/feed-release.json 2>/dev/null; then
              echo "Merging AltStore history from $previous_tag."
            else
              printf '{}' > altstore-channel/feed-release.json
            fi
          fi

          previous_asset_url="$(jq -r '[.assets[]? | select(.name == "altstore-source.json")][0].browser_download_url // empty' \
            altstore-channel/feed-release.json)"
          if [[ -n "$previous_asset_url" ]]; then
            curl -fsSL "$previous_asset_url" -o altstore-channel/previous.json || true
          fi
          if [[ ! -s altstore-channel/previous.json ]]; then
            printf '{"apps":[]}' > altstore-channel/previous.json
          fi

          python3 .github/scripts/update_altstore_feed.py \
            --new-source release-assets/altstore-source.json \
            --previous altstore-channel/previous.json \
            --output altstore-channel/altstore-source.json

          gh release upload "$served_tag" altstore-channel/altstore-source.json \
            --repo "$GITHUB_REPOSITORY" --clobber

          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$served_tag" \
            --jq '.assets[] | select(.name == "altstore-source.json") | .id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -H "Accept: application/octet-stream" > altstore-channel/served.json
          python3 - altstore-channel/served.json altstore-channel/altstore-source.json <<'PY'
          import json
          import sys
          from pathlib import Path

          served = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          served_versions = [
              (v.get("version"), v.get("buildVersion"))
              for v in served["apps"][0]["versions"]
          ]
          expected_entry = (
              expected["apps"][0]["versions"][0].get("version"),
              expected["apps"][0]["versions"][0].get("buildVersion"),
          )
          if expected_entry not in served_versions:
              raise SystemExit(
                  f"rolling AltStore feed does not contain the new release {expected_entry}"
              )
          if served_versions[0] != expected_entry:
              print(
                  "note: the feed serves a newer release first; "
                  f"{expected_entry} was merged into history."
              )
          print(f"Verified rolling feed serves {len(served_versions)} versions.")
          PY

          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$served_tag/altstore-source.json"
          {
            echo
            echo "## AltStore channel feed"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Updated AltStore channel feed: $url"

      - name: Publish repository app source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            feed="app-repo-beta.json"
          else
            feed="app-repo.json"
          fi

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$feed?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$current_sha" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/$feed?ref=main" --jq '.content' \
              | tr -d '\n' | base64 --decode > current-app-repo.json
          else
            printf '{"apps":[{"versions":[]}]}' > current-app-repo.json
          fi

          python3 - "$feed" <<'PY'
          import json
          import sys
          from pathlib import Path

          feed = sys.argv[1]
          new_source = json.loads(Path("release-assets/altstore-source.json").read_text(encoding="utf-8"))
          current_source = json.loads(Path("current-app-repo.json").read_text(encoding="utf-8"))

          new_app = new_source["apps"][0]
          new_version = new_app["versions"][0]
          current_apps = current_source.get("apps") or []
          current_versions = current_apps[0].get("versions", []) if current_apps else []

          version_name = new_version.get("version")
          new_app["versions"] = [new_version] + [
              version for version in current_versions
              if version.get("version") != version_name
          ]

          if feed == "app-repo-beta.json":
              new_source["name"] = "InputPilot Beta"
              new_source["subtitle"] = "InputPilot beta releases for early testing."
              new_source["description"] = "Install and update InputPilot beta builds."

          Path("merged-app-repo.json").write_text(
              json.dumps(new_source, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          content="$(base64 -w0 merged-app-repo.json)"
          args=(
            -f "message=Update $feed for ${{ steps.release.outputs.tag }}"
            -f "content=$content"
            -f "branch=main"
          )
          if [[ -n "$current_sha" ]]; then
            args+=(-f "sha=$current_sha")
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$feed" "${args[@]}" >/dev/null

          url="https://github.com/$GITHUB_REPOSITORY/raw/main/$feed"
          {
            echo
            echo "## App source"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published app source: $url"
