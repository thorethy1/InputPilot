name: Create beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version (for example 0.9.0-beta.1)
        required: true
        default: 0.9.0-beta.1
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-beta-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout latest beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Set beta version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin beta --tags
          git checkout -B beta origin/beta
          version="$RELEASE_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Beta version must match MAJOR.MINOR.PATCH-beta.NUMBER; got '$version'."
            exit 1
          fi
          previous="$(python3 versioning.py show-release)"
          python3 versioning.py set-release "$version" >/dev/null
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Increase the beta number."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "Release InputPilot $version"
          fi
          sha="$(git rev-parse HEAD)"
          branch="beta-release/$tag-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Start CI for beta release commit
        shell: bash
        run: >-
          gh workflow run ci.yml
          --ref '${{ steps.version.outputs.branch }}'
          --repo "$GITHUB_REPOSITORY"

      - name: Require successful CI
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'
          run_id=""
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$sha" --event workflow_dispatch --limit 10 \
              --json databaseId,status,conclusion,url)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then break; fi
            echo "Waiting for CI run on $sha (attempt $attempt/60)..."
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::CI did not start for $sha."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Tag and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          sha='${{ steps.version.outputs.sha }}'
          git push origin "$sha:refs/heads/beta"
          git tag -a "$tag" "$sha" -m "InputPilot ${{ steps.version.outputs.version }}"
          git push origin "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "InputPilot ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --prerelease \
            --verify-tag

      - name: Attach and verify beta artifacts
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" \
            --ref beta -f tag='${{ steps.version.outputs.tag }}'
          run_id=""
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow release-assets.yml --event workflow_dispatch \
              --commit "$sha" --limit 10 --json databaseId)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then break; fi
            echo "Waiting for release asset workflow (attempt $attempt/60)..."
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Release asset workflow did not start."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          {
            echo "## InputPilot ${{ steps.version.outputs.version }}"
            echo
            echo "Previous beta identity: ${{ steps.version.outputs.previous }}"
            echo "CI run: ${{ steps.ci.outputs.run_id }}"
            echo "Release asset run: $run_id"
            echo "The versioned prerelease, OTA assets and rolling AltStore beta feed are complete."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary beta release branch
        if: always() && steps.version.outputs.branch != ''
        shell: bash
        run: git push origin --delete '${{ steps.version.outputs.branch }}' || true
