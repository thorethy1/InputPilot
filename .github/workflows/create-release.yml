name: Create release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set stable release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main
          previous="$(python3 versioning.py show)"
          if [[ '${{ inputs.bump }}' == 'none' ]]; then
            version="$(python3 versioning.py show)"
            python3 versioning.py set-release "$version" >/dev/null
          else
            version="$(python3 versioning.py bump '${{ inputs.bump }}')"
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "Release InputPilot $version"
          fi
          sha="$(git rev-parse HEAD)"
          branch="release/$tag-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Reuse or start CI for release commit
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'
          release_ref='${{ steps.version.outputs.branch }}'
          run_id=""
          reused="false"

          has_required_artifacts() {
            local candidate="$1"
            local artifacts
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100")"
            jq -e \
              --arg firmware "InputPilot-Firmware-$sha" \
              --arg ios "InputPilot-unsigned-$sha" '
                [.artifacts[] | select(.expired == false) | .name] as $names |
                ($names | index($firmware)) != null and
                ($names | index($ios)) != null
              ' <<<"$artifacts" >/dev/null
          }

          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$sha" --limit 30 \
            --json databaseId,status,conclusion,url)"

          while read -r candidate; do
            if has_required_artifacts "$candidate"; then
              run_id="$candidate"
              reused="true"
              echo "Reusing successful CI run $run_id for exact commit $sha."
              break
            fi
          done < <(jq -r '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' <<<"$runs")

          if [[ -z "$run_id" ]]; then
            active_id="$(jq -r '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")][0].databaseId // empty' <<<"$runs")"
            if [[ -n "$active_id" ]]; then
              echo "Waiting for existing CI run $active_id on exact commit $sha."
              if gh run watch "$active_id" --repo "$GITHUB_REPOSITORY" --exit-status && has_required_artifacts "$active_id"; then
                run_id="$active_id"
                reused="true"
                echo "Reusing completed CI run $run_id."
              else
                echo "Existing CI run $active_id failed or did not retain all release artifacts; starting a fallback run."
              fi
            fi
          fi

          if [[ -z "$run_id" ]]; then
            declare -A previous_runs=()
            while read -r existing_id; do previous_runs["$existing_id"]=1; done \
              < <(jq -r '.[].databaseId' <<<"$runs")

            echo "No reusable CI run with release artifacts exists; dispatching CI for $sha."
            gh workflow run ci.yml --ref "$release_ref" --repo "$GITHUB_REPOSITORY"

            for attempt in $(seq 1 60); do
              dispatched="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --commit "$sha" --event workflow_dispatch --limit 30 \
                --json databaseId,status,conclusion,url)"
              while read -r candidate; do
                if [[ -z "${previous_runs[$candidate]:-}" ]]; then
                  run_id="$candidate"
                  break
                fi
              done < <(jq -r '.[].databaseId' <<<"$dispatched")
              if [[ -n "$run_id" ]]; then break; fi
              echo "Waiting for dispatched CI run on $sha (attempt $attempt/60)..."
              sleep 5
            done
            if [[ -z "$run_id" ]]; then
              echo "::error::CI did not start for $sha."
              exit 1
            fi
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
            if ! has_required_artifacts "$run_id"; then
              echo "::error::CI run $run_id did not produce both required release artifacts."
              exit 1
            fi
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          sha='${{ steps.version.outputs.sha }}'
          git push origin "$sha:refs/heads/main"
          git tag -a "$tag" "$sha" -m "InputPilot ${{ steps.version.outputs.version }}"
          git push origin "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "InputPilot ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag

      - name: Attach and verify artifacts from validated CI
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f tag='${{ steps.version.outputs.tag }}'
          run_id=""
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow release-assets.yml --event workflow_dispatch \
              --commit "$sha" --limit 10 --json databaseId)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then break; fi
            echo "Waiting for release asset workflow (attempt $attempt/60)..."
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Release asset workflow did not start."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          {
            echo "## InputPilot ${{ steps.version.outputs.version }}"
            echo
            echo "Stable version prepared from ${{ steps.version.outputs.previous }} using Version.xcconfig."
            echo "CI run: ${{ steps.ci.outputs.run_id }}"
            echo "Existing CI reused: ${{ steps.ci.outputs.reused }}"
            echo "Release asset run: $run_id"
            echo "The public release and its verified assets are complete."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary release branch
        if: always() && steps.version.outputs.branch != ''
        shell: bash
        run: git push origin --delete '${{ steps.version.outputs.branch }}' || true
