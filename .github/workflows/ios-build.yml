name: iOS Signed Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ipa:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "::error::InputPilot requires Xcode 26 or newer (found major=${major:-unknown})."
            exit 1
          fi

      - name: Verify signing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Configure them under Settings > Secrets and variables > Actions. Secret values were not logged."
            exit 1
          fi

      - name: Install and validate signing material
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/signing.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$cert" "$profile" "$profile_plist" "$RUNNER_TEMP/signing-cert.pem"
          }
          trap cleanup EXIT
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n '1s/.*"\(.*\)"/\1/p')"
          if [[ -z "$identity" ]]; then echo "::error::No valid code-signing identity found in the certificate."; exit 1; fi
          security cms -D -i "$profile" > "$profile_plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_team="${app_identifier%%.*}"
          profile_bundle="${app_identifier#*.}"
          bundle="${IOS_BUNDLE_ID:-$profile_bundle}"
          team="${APPLE_TEAM_ID:-$profile_team}"
          if [[ "$bundle" != "$profile_bundle" && "$profile_bundle" != *'*'* ]]; then echo "::error::Bundle ID mismatch between IOS_BUNDLE_ID and provisioning profile."; exit 1; fi
          if [[ "$team" != "$profile_team" ]]; then echo "::error::Team ID mismatch between APPLE_TEAM_ID and provisioning profile."; exit 1; fi
          if [[ "$(date -j -f '%a %b %d %T %Z %Y' "$expiration" '+%s')" -le "$(date '+%s')" ]]; then echo "::error::Provisioning profile expired."; exit 1; fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          method=ad-hoc
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" 2>/dev/null | grep -qi true; then method=enterprise
          elif /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null | grep -qi true; then method=development
          fi
          if [[ "$method" != enterprise ]] && ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$profile_plist" >/dev/null 2>&1; then echo "::error::Provisioning profile contains no registered devices."; exit 1; fi
          echo "Signing prerequisites valid: identity found, profile current, bundle/team match, export method=$method."
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "team=$team" >> "$GITHUB_OUTPUT"
          echo "method=$method" >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Archive iOS app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive -project InputPilot.xcodeproj -scheme InputPilot \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/InputPilot.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='${{ steps.signing.outputs.team }}' \
            PRODUCT_BUNDLE_IDENTIFIER='${{ steps.signing.outputs.bundle }}' \
            CODE_SIGN_IDENTITY='${{ steps.signing.outputs.identity }}' \
            PROVISIONING_PROFILE_SPECIFIER='${{ steps.signing.outputs.profile_name }}' \
            OTHER_CODE_SIGN_FLAGS='--keychain ${{ steps.signing.outputs.keychain }}'

      - name: Export signed IPA
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string ${{ steps.signing.outputs.method }}' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :teamID string ${{ steps.signing.outputs.team }}' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:${{ steps.signing.outputs.bundle }} string ${{ steps.signing.outputs.profile_name }}' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string ${{ steps.signing.outputs.identity }}' "$export_options"
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/InputPilot.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$export_options" \
            OTHER_CODE_SIGN_FLAGS='--keychain ${{ steps.signing.outputs.keychain }}'
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "$ipa" ]] || { echo "::error::Archive exported without an IPA."; exit 1; }
          mv "$ipa" "$RUNNER_TEMP/InputPilot.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputPilot-development-${{ github.run_number }}
          path: ${{ runner.temp }}/InputPilot.ipa
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain '${{ steps.signing.outputs.keychain }}' >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.uuid }}.mobileprovision"
