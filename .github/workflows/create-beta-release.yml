name: Create beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version (for example 0.9.0-beta.1)
        required: true
        default: 0.9.0-beta.1
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-beta-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout latest beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Require green CI on beta head
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse origin/beta)"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$head_sha" --limit 20 \
            --json databaseId,status,conclusion,url)"
          latest="$(jq -r 'if length > 0 then .[0] else empty end' <<<"$runs")"
          if [[ -z "$latest" ]]; then
            echo "::error::No CI run found for beta head $head_sha. Push changes and let CI run first."
            exit 1
          fi
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
          url="$(jq -r '.url' <<<"$latest")"
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::Latest CI run on beta ($head_sha) is status=$status conclusion=$conclusion: $url"
            echo "This workflow never starts its own CI. Fix or wait for CI to be green, then retry."
            exit 1
          fi
          echo "Latest CI run on beta head $head_sha is green: $url"

      - name: Set beta version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin beta --tags
          git checkout -B beta origin/beta
          version="$RELEASE_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Beta version must match MAJOR.MINOR.PATCH-beta.NUMBER; got '$version'."
            exit 1
          fi
          previous="$(python3 versioning.py show-release)"
          python3 versioning.py set-release "$version" >/dev/null
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Increase the beta number."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "Release InputPilot $version"
          fi
          sha="$(git rev-parse HEAD)"
          # The release commit goes straight to the branch so the regular
          # push-triggered CI covers it; this workflow never dispatches CI.
          git push origin "HEAD:refs/heads/beta"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require green branch CI on the release commit
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'

          has_required_artifacts() {
            local candidate="$1"
            local artifacts
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100")"
            jq -e \
              --arg firmware "InputPilot-Firmware-$sha" \
              --arg ios "InputPilot-unsigned-$sha" '
                [.artifacts[] | select(.expired == false) | .name] as $names |
                ($names | index($firmware)) != null and
                ($names | index($ios)) != null
              ' <<<"$artifacts" >/dev/null
          }

          run_id=""
          for attempt in $(seq 1 120); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$sha" --limit 30 \
              --json databaseId,status,conclusion,url)"

            run_id="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]] && has_required_artifacts "$run_id"; then
              break
            fi
            run_id=""

            active_id="$(jq -r '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")][0].databaseId // empty' <<<"$runs")"
            if [[ -n "$active_id" ]]; then
              echo "Observing the branch CI run $active_id on commit $sha (attempt $attempt/120)..."
              gh run watch "$active_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15 || true
            else
              completed="$(jq '[.[] | select(.status == "completed")] | length' <<<"$runs")"
              if (( completed > 0 )); then
                echo "::error::CI already completed for $sha without a successful run holding both release artifacts."
                jq -r '.[] | "run \(.databaseId): status=\(.status) conclusion=\(.conclusion) \(.url)"' <<<"$runs"
                exit 1
              fi
              echo "Waiting for the branch CI run to appear for $sha (attempt $attempt/120)..."
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful branch CI run with both release artifacts appeared for $sha."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Green branch CI run $run_id verified for $sha."

      - name: Tag and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          sha='${{ steps.version.outputs.sha }}'
          git tag -a "$tag" "$sha" -m "InputPilot ${{ steps.version.outputs.version }}"
          git push origin "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "InputPilot ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --prerelease \
            --verify-tag

      - name: Attach and verify beta artifacts
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.version.outputs.sha }}'
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" \
            --ref beta -f tag='${{ steps.version.outputs.tag }}'
          run_id=""
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow release-assets.yml --event workflow_dispatch \
              --commit "$sha" --limit 10 --json databaseId)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then break; fi
            echo "Waiting for release asset workflow (attempt $attempt/60)..."
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Release asset workflow did not start."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          {
            echo "## InputPilot ${{ steps.version.outputs.version }}"
            echo
            echo "Previous beta identity: ${{ steps.version.outputs.previous }}"
            echo "Branch CI run: ${{ steps.ci.outputs.run_id }}"
            echo "Release asset run: $run_id"
            echo "The versioned prerelease, OTA assets and rolling AltStore beta feed are complete."
          } >> "$GITHUB_STEP_SUMMARY"
