# Cloud-runnable checks for InputPilot firmware + companion apps (no physical board).
# On-device pytest (integration, HID E2E, WiFi, BLE, mDNS) stays local-only.
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Native unit tests + firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: usb-hid-s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
          key: pio-${{ runner.os }}-${{ hashFiles('usb-hid-s3/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          # pioarduino ships esptool 5.0.0-dev1, which breaks on click>=8.2
          # (ParamType.get_metavar requires ctx). Pin until tool-esptoolpy updates.
          pip install "click>=8.1.7,<8.2"

      - name: Native unit tests (no hardware)
        run: pio test -e native -v

      - name: Build esp32s3 firmware
        run: pio run -e esp32s3

      - name: Test release packaging
        working-directory: ${{ github.workspace }}
        run: |
          python .github/scripts/test_package_release_assets.py
          python .github/scripts/test_update_altstore_feed.py
          python .github/scripts/test_versioning.py

      - name: Generate OTA manifest and checksum
        run: |
          python scripts/generate_ota_assets.py \
            --firmware .pio/build/esp32s3/firmware.bin \
            --output .pio/build/esp32s3

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputPilot-Firmware-${{ github.sha }}
          path: |
            usb-hid-s3/.pio/build/esp32s3/firmware.bin
            usb-hid-s3/.pio/build/esp32s3/bootloader.bin
            usb-hid-s3/.pio/build/esp32s3/partitions.bin
            usb-hid-s3/.pio/build/esp32s3/boot_app0.bin
            usb-hid-s3/.pio/build/esp32s3/flash_args
            usb-hid-s3/.pio/build/esp32s3/initial-flash.bin
            usb-hid-s3/.pio/build/esp32s3/initial-flash-manifest.json
            usb-hid-s3/.pio/build/esp32s3/firmware.sha256
            usb-hid-s3/.pio/build/esp32s3/firmware-manifest.json
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for iOS project
        id: guard
        run: |
          if [ -f ios/InputPilot.xcodeproj/project.pbxproj ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ios/ companion not in this commit; skipping iOS job steps."
          fi

      - name: Show Xcode version
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "::error::InputPilot requires Xcode 26 or newer (found major=${major:-unknown})."
            exit 1
          fi

      - name: Resolve iOS Simulator destination
        if: steps.guard.outputs.present == 'true'
        id: sim
        run: |
          set -euo pipefail
          udid="$(python3 - <<'PY'
          import json, subprocess, sys

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          preferred = [
              "iPhone 16",
              "iPhone 17",
              "iPhone 15",
              "iPhone SE (3rd generation)",
          ]
          available = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      available.append((device["name"], device["udid"]))

          # Prefer a known name, else first unique iPhone.
          seen = []
          for item in available:
              if item not in seen:
                  seen.append(item)
          for name in preferred:
              match = next((item for item in seen if item[0] == name), None)
              if match:
                  print(match[1])
                  sys.exit(0)
          if seen:
              print(seen[0][1])
              sys.exit(0)
          sys.stderr.write("No available iPhone simulator\n")
          sys.exit(1)
          PY
          )"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          echo "destination=platform=iOS Simulator,id=${udid}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${udid}"

      - name: Build and test InputPilot
        if: steps.guard.outputs.present == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project InputPilot.xcodeproj \
            -scheme InputPilot \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/InputPilotDerived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            INPUTPILOT_GIT_COMMIT="${GITHUB_SHA::7}" \
            INPUTPILOT_BUILD="$GITHUB_RUN_NUMBER"

  ios-package:
    name: iOS unsigned IPA
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Xcode 26 or newer
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "::error::InputPilot requires Xcode 26 or newer (found major=${major:-unknown})."
            exit 1
          fi

      - name: Build unsigned iOS device app
        working-directory: ios
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/InputPilotUnsignedDerived"
          xcodebuild build \
            -project InputPilot.xcodeproj \
            -scheme InputPilot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.thorethy.inputpilot \
            INPUTPILOT_GIT_COMMIT="${GITHUB_SHA::7}" \
            INPUTPILOT_BUILD="$GITHUB_RUN_NUMBER"

          app="$derived/Build/Products/Release-iphoneos/InputPilot.app"
          [[ -d "$app" ]] || { echo "::error::Unsigned device app was not produced."; exit 1; }
          find "$app" -name embedded.mobileprovision -type f -delete
          find "$app" -name _CodeSignature -type d -prune -exec rm -rf {} +
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          [[ "$bundle_id" == com.thorethy.inputpilot ]] || { echo "::error::Unexpected unsigned bundle ID: $bundle_id"; exit 1; }
          if find "$app" \( -name embedded.mobileprovision -o -name _CodeSignature \) -print -quit | grep -q .; then
            echo "::error::Unsigned app still contains signing material."
            exit 1
          fi
          stage="$RUNNER_TEMP/InputPilotUnsigned"
          mkdir -p "$stage/Payload"
          ditto "$app" "$stage/Payload/InputPilot.app"
          (cd "$stage" && zip -qry "$RUNNER_TEMP/InputPilot-unsigned.ipa" Payload)
          [[ -s "$RUNNER_TEMP/InputPilot-unsigned.ipa" ]] || { echo "::error::Unsigned IPA was not produced."; exit 1; }

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputPilot-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/InputPilot-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
