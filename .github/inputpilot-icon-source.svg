<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="48%" stop-color="#111214"/>
      <stop offset="100%" stop-color="#060607"/>
    </radialGradient>

    <linearGradient id="redGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff666d"/>
      <stop offset="34%" stop-color="#ff2b39"/>
      <stop offset="72%" stop-color="#e20d22"/>
      <stop offset="100%" stop-color="#a90016"/>
    </linearGradient>

    <linearGradient id="redEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7d83"/>
      <stop offset="45%" stop-color="#ff2334"/>
      <stop offset="100%" stop-color="#c4081d"/>
    </linearGradient>

    <linearGradient id="whiteGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#d7d9de" stop-opacity="0.78"/>
    </linearGradient>

    <linearGradient id="planeGloss" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ff5b65" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a70017" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Shadows / glow -->
    <filter id="outerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.52"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0
                0 0.10 0 0 0
                0 0 0.12 0 0
                0 0 0 0.38 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>

    <filter id="symbolShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff2334" flood-opacity="0.14"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="54" y="54" width="916" height="916" rx="218"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <g filter="url(#outerShadow)">
    <rect x="54" y="54" width="916" height="916" rx="218" fill="url(#bgGlow)"/>
    <rect x="66" y="66" width="892" height="892" rx="206"
          fill="none" stroke="#ffffff" stroke-opacity="0.075" stroke-width="3"/>
  </g>

  <!-- Subtle glass reflections -->
  <g clip-path="url(#tileClip)">
    <path d="M64 180 C250 70 560 66 930 176 L930 326 C650 220 332 210 64 304 Z"
          fill="#ffffff" opacity="0.035"/>
    <ellipse cx="256" cy="164" rx="280" ry="120" fill="#ffffff" opacity="0.025"/>
    <ellipse cx="806" cy="796" rx="310" ry="180" fill="#ff1f33" opacity="0.035"/>
  </g>

  <!-- Large ESP32-style PCB antenna -->
  <g filter="url(#symbolShadow)">
    <path d="
      M236 256
      H338
      V176
      H442
      V256
      H512
      V176
      H616
      V256
      H788"
      fill="none"
      stroke="url(#redEdge)"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"/>
    <!-- upper highlight -->
    <path d="
      M236 246
      H328
      V166
      H452
      V246
      H502
      V166
      H626
      V246
      H788"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.12"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <!-- Wireless transmission arcs -->
  <g fill="none" stroke-linecap="round" filter="url(#symbolShadow)">
    <path d="M390 352 Q512 252 634 352" stroke="url(#redGlass)" stroke-width="30"/>
    <path d="M430 408 Q512 342 594 408" stroke="url(#redGlass)" stroke-width="28"/>
  </g>

  <!-- Main centered paper plane -->
  <g filter="url(#symbolShadow)">
    <!-- main red body -->
    <path d="
      M512 410
      L735 610
      L576 582
      L512 770
      L448 582
      L289 610
      Z"
      fill="url(#redGlass)"/>

    <!-- inner glass facet -->
    <path d="
      M512 434
      L682 585
      L562 564
      L512 712
      Z"
      fill="url(#planeGloss)"
      opacity="0.60"/>

    <!-- central fold -->
    <path d="M512 434 L512 735"
          stroke="#ffffff"
          stroke-opacity="0.20"
          stroke-width="7"
          stroke-linecap="round"/>

    <!-- top edge highlight -->
    <path d="M315 600 L512 426 L708 600"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.22"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Input symbols: mouse + keyboard, balanced left/right -->
  <g filter="url(#symbolShadow)">
    <!-- Mouse -->
    <rect x="192" y="650" width="174" height="236" rx="87"
          fill="#ffffff" fill-opacity="0.028"
          stroke="url(#redEdge)" stroke-width="28"/>
    <path d="M279 676 V744"
          stroke="url(#whiteGlass)"
          stroke-width="18"
          stroke-linecap="round"/>
    <path d="M279 665 V712"
          stroke="#ffffff"
          stroke-opacity="0.16"
          stroke-width="8"
          stroke-linecap="round"/>

    <!-- Keyboard -->
    <rect x="658" y="680" width="190" height="154" rx="30"
          fill="#ffffff" fill-opacity="0.028"
          stroke="url(#redEdge)" stroke-width="28"/>

    <g fill="url(#whiteGlass)">
      <rect x="691" y="711" width="28" height="24" rx="7"/>
      <rect x="735" y="711" width="28" height="24" rx="7"/>
      <rect x="779" y="711" width="28" height="24" rx="7"/>

      <rect x="691" y="750" width="28" height="24" rx="7"/>
      <rect x="735" y="750" width="28" height="24" rx="7"/>
      <rect x="779" y="750" width="28" height="24" rx="7"/>

      <rect x="691" y="789" width="116" height="18" rx="8"/>
    </g>
  </g>

  <!-- Soft red ambient glow behind central symbol -->
  <ellipse cx="512" cy="532" rx="220" ry="190"
           fill="#ff2032" opacity="0.045" filter="url(#softGlow)"/>
</svg>
